name: Daily News Worksheet Automation

on:
  schedule:
    - cron: '0 23 * * *' # Chạy tự động mỗi ngày lúc 23:00 UTC (tương ứng 6:00 sáng giờ Việt Nam)
  workflow_dispatch: # Cho phép bạn bấm nút test thủ công bất cứ lúc nào

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests huggingface_hub

      - name: Run Summarizer Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python summarize.py
